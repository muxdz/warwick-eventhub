services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: example_user
      POSTGRES_PASSWORD: example_password
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5544:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example_user -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
