name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

  workflow_dispatch:

concurrency:
  group: eventhub-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: eventhub-backend
  ECS_CLUSTER: eventhub-cluster
  ECS_SERVICE: eventhub-backend-service
  ECS_TASK_DEFINITION: eventhub-backend
  CONTAINER_NAME: eventhub-backend

jobs:

  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: eventhub_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      DB_CONNECT_TIMEOUT: 5
      DB_SSL_MODE: disable

      JWT_SECRET_KEY: test-secret-key-only-for-ci
      JWT_EXPIRE_MINUTES: 30

      CORS_ORIGIN: '["http://localhost:3000"]'

    services:
      postgres:
        image: postgres:18

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eventhub_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres -d eventhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Apply test database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest


  deploy:
    if: github.event_name != 'pull_request'

    needs:
      - test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            -t "$IMAGE" \
            ./backend

          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            > task-definition.json

      - name: Put new image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Migrate production database and deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}

          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}

          run-task: true
          run-task-launch-type: FARGATE

          run-task-subnets: >-
            ${{ vars.ECS_PUBLIC_SUBNET_A }},${{ vars.ECS_PUBLIC_SUBNET_B }}

          run-task-security-groups: >-
            ${{ vars.ECS_API_SECURITY_GROUP }}

          run-task-assign-public-IP: ENABLED

          run-task-container-overrides: >-
            [{"name":"eventhub-backend","command":["alembic","upgrade","head"]}]

          wait-for-task-stopped: true
          wait-for-service-stability: true
          wait-max-delay-seconds: 15