name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  migration-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create test environment
        run: cp .env.test.example .env.test

      - name: Build backend test image
        run: docker compose --env-file .env.test build tests

      - name: Run migration smoke test
        run: ./scripts/migration_smoke.sh

      - name: Show database logs on failure
        if: failure()
        run: docker compose --env-file .env.test logs db-test

      - name: Clean up
        if: always()
        run: docker compose --env-file .env.test down -v
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: example_user
          POSTGRES_PASSWORD: example_password
          POSTGRES_DB: eventhub_test
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U example_user -d eventhub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      ENV_FILE: .env.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: cp .env.test.example .env.test
      - run: alembic upgrade head
      - run: alembic current --check-heads
      - run: python -m pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env.local
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      # This job has no API or database: build must work offline from FastAPI.
      - run: npm run build
      - run: npm audit
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: example_user
          POSTGRES_PASSWORD: example_password
          POSTGRES_DB: eventhub_e2e
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U example_user -d eventhub_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -r backend/requirements-dev.txt
          cp backend/.env.e2e.example backend/.env.e2e
          cp frontend/.env.example frontend/.env.local
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: frontend/test-results/
